name: Project CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: beeline_test
          POSTGRES_USER: beeline_test
          POSTGRES_PASSWORD: beeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beeline_test -d beeline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Credentials belong only to this job's temporary PostgreSQL container.
      DATABASE_URL: postgresql+psycopg://beeline_test:beeline_test@127.0.0.1:5432/beeline_test
      TEST_DATABASE_URL: postgresql+psycopg://beeline_test:beeline_test@127.0.0.1:5432/beeline_test
      NOTIFICATION_DISPATCHER_ENABLED: "false"
      JWT_SECRET_KEY: isolated-ci-only-key-at-least-thirty-two-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            planner/requirements.lock
            constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=ortools --require-hashes -r requirements.lock -r ../planner/requirements.lock
          python -m pip check

      - name: Record sanitized environment versions
        run: python -m testing.ci_metadata --output .local/planning-e2e/environment.json

      - name: Check code with Ruff
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run Python backend tests
        run: |
          # Database absence fails the required integration suite.
          test -n "$TEST_DATABASE_URL"
          python -m unittest discover -s tests -v 2>&1 | tee .local/planning-e2e/backend-unittest.log

      - name: Run native solver benchmark
        run: python ../planner/benchmark.py --output .local/planning-e2e/benchmark-summary.json

      - name: Verify synthetic packages and repeatable isolated seed
        run: |
          python generate_synthetic.py --output .local/generated --tickets 1500 --workers 120 --days 7
          python seed_synthetic.py --seed 42 --tickets 1500 --workers 120 --days 7
          python seed_synthetic.py --seed 42 --tickets 1500 --workers 120 --days 7

      - name: Verify planning datasets
        run: python generate_planning_synthetic.py --output .local/planning-synthetic

      - name: Verify committed CSV-XLSX packages and T01 policy scenarios
        run: python verify_synthetic.py

      - name: Backend, real planner, PostgreSQL and Bruno E2E
        run: python run_planning_e2e.py --report-dir .local/planning-e2e

      - name: Preserve API test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-reports-${{ github.sha }}
          path: |
            backend/.local/planning-e2e/
          if-no-files-found: ignore

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  planner-tests:
    name: Planner API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            planner/requirements.lock
            constraints.txt
      - run: python -m pip install --only-binary=ortools --require-hashes -r requirements.lock
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v

  assistant-tests:
    name: Assistant checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: assistant/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -t . -v
