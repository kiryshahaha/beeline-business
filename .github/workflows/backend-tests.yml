name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: beeline_test
          POSTGRES_USER: beeline_test
          POSTGRES_PASSWORD: beeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beeline_test -d beeline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Credentials belong only to this job's temporary PostgreSQL container.
      DATABASE_URL: postgresql+psycopg://beeline_test:beeline_test@127.0.0.1:5432/beeline_test
      TEST_DATABASE_URL: postgresql+psycopg://beeline_test:beeline_test@127.0.0.1:5432/beeline_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check code with Ruff
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run Python backend tests
        run: |
          # Without this variable, database tests would be skipped.
          test -n "$TEST_DATABASE_URL"
          python -m unittest discover -s tests -v

      - name: Apply migrations and seed demo data
        run: |
          python -m alembic upgrade head
          python seed_demo.py

      - name: Run Bruno E2E API tests
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            EXIT_CODE=$?
            echo "Stopping FastAPI server (PID: $SERVER_PID)..."
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            if [ "$EXIT_CODE" -ne 0 ]; then
              echo "=== Uvicorn Server Log ==="
              cat uvicorn.log || true
            fi
          }
          trap cleanup EXIT

          echo "Waiting for FastAPI server to become ready..."
          READY=0
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:8000/health > /dev/null; then
              echo "FastAPI server is ready!"
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Error: FastAPI server failed to start within 30 seconds."
            exit 1
          fi

          cd bruno
          npx --yes @usebruno/cli@4.1.0 run -r --env Local
