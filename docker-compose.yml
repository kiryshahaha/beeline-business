services:
  db:
    image: postgres:16-alpine
    container_name: beeline_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beeline}
      POSTGRES_USER: ${POSTGRES_USER:-beeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beeline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beeline} -d ${POSTGRES_DB:-beeline}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  planner:
    build:
      context: ./planner
      dockerfile: Dockerfile
    container_name: beeline_planner
    restart: unless-stopped
    ports:
      - "${PLANNER_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beeline_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-beeline}:${POSTGRES_PASSWORD:-beeline}@db:5432/${POSTGRES_DB:-beeline}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      NOTIFICATION_DISPATCHER_ENABLED: ${NOTIFICATION_DISPATCHER_ENABLED:-true}
      NOTIFICATION_POLL_INTERVAL_SECONDS: ${NOTIFICATION_POLL_INTERVAL_SECONDS:-1.0}
      AUTO_SEED: ${AUTO_SEED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      planner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: beeline_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    container_name: beeline_ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  # Одноразово скачивает модель в том ollama_data; при повторном запуске проверяет, что она есть.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: beeline_ollama_pull
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${ASSISTANT_MODEL:-qwen3.5:0.8b}"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - app-network

  assistant:
    build:
      context: ./assistant
      dockerfile: Dockerfile
    container_name: beeline_assistant
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen3.5:0.8b}
      LLM_NUM_THREAD: ${LLM_NUM_THREAD:-}
    ports:
      - "${ASSISTANT_PORT:-8002}:8002"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local

networks:
  app-network:
    driver: bridge
