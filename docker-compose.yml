services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beeline}
      POSTGRES_USER: ${POSTGRES_USER:-beeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be generated for this environment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beeline} -d ${POSTGRES_DB:-beeline}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  planner:
    build:
      context: ./planner
      dockerfile: Dockerfile
    environment:
      PLANNER_SERVICE_TOKEN: ${PLANNER_SERVICE_TOKEN:-}
    restart: unless-stopped
    ports:
      - "${PLANNER_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-beeline}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be generated for this environment}@db:5432/${POSTGRES_DB:-beeline}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set to a private value of at least 32 bytes}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      NOTIFICATION_DISPATCHER_ENABLED: ${NOTIFICATION_DISPATCHER_ENABLED:-true}
      NOTIFICATION_POLL_INTERVAL_SECONDS: ${NOTIFICATION_POLL_INTERVAL_SECONDS:-1.0}
      PLANNING_ENABLED: ${PLANNING_ENABLED:-false}
      PLANNER_BASE_URL: ${PLANNER_BASE_URL:-http://planner:8001}
      PLANNER_SERVICE_TOKEN: ${PLANNER_SERVICE_TOKEN:-}
      PLANNING_SOLVE_TIME_LIMIT_SECONDS: ${PLANNING_SOLVE_TIME_LIMIT_SECONDS:-5}
      PLANNING_PREVIEW_TTL_SECONDS: ${PLANNING_PREVIEW_TTL_SECONDS:-300}
      PLANNING_TOTAL_TIMEOUT_SECONDS: ${PLANNING_TOTAL_TIMEOUT_SECONDS:-60}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GEOAPIFY_TIMEOUT_SECONDS: ${GEOAPIFY_TIMEOUT_SECONDS:-10}
      AUTO_SEED: ${AUTO_SEED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # POST /api/v1/assistant/chat отвечает 503, пока помощник не включён.
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      planner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY:-}
        NEXT_PUBLIC_GEOAPIFY_API_KEY: ${NEXT_PUBLIC_GEOAPIFY_API_KEY:-}
    container_name: beeline_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: beeline_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    container_name: beeline_ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  # Одноразово скачивает модель в том ollama_data; при повторном запуске проверяет, что она есть.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: beeline_ollama_pull
    environment:
      OLLAMA_HOST: http://ollama:11434
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen3.5:2b}
    # A fine-tuned GGUF placed in assistant/model/model.gguf becomes ASSISTANT_MODEL;
    # without it the stock model is pulled from the Ollama registry.
    volumes:
      - ./assistant/model:/model:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -f /model/model.gguf ];
        then ollama create "$$ASSISTANT_MODEL" -f /model/Modelfile;
        else ollama pull "$$ASSISTANT_MODEL"; fi
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - app-network

  assistant:
    build:
      context: ./assistant
      dockerfile: Dockerfile
    container_name: beeline_assistant
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen3.5:2b}
      LLM_NUM_THREAD: ${LLM_NUM_THREAD:-}
    ports:
      - "${ASSISTANT_PORT:-8002}:8002"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local

networks:
  app-network:
    driver: bridge
