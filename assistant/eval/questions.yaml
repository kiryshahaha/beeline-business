# Набор проверки ассистента.
#   must        — группы фактов; группа засчитана, если в ответе есть любой из вариантов
#                 (без учёта регистра, ё = е). Оценка вопроса = доля засчитанных групп.
#   must_not    — фрагменты, появление которых означает выдумку или неверный совет.
#   sources     — разделы базы знаний, которые должен найти поиск (для hit@k).
#   context     — ключ из contexts.yaml.
#   answered_by — facts: ответ должен собираться из данных системы, без модели.
# Автоматическая оценка грубая: ответы модели дополнительно читаются вручную.

# --- Исполнитель: как сделать в системе ---
- id: w-start
  role: worker
  category: howto
  question: Я приехал к клиенту и начинаю работу. Что нажать?
  must: [[начал работу, в работе]]
  sources: [system/statuses.md, system/worker.md]

- id: w-finish
  role: worker
  category: howto
  question: Всё сделал у клиента. Как правильно закрыть заявку?
  must: [[завершил], [подтвер, диспетчер]]
  sources: [system/worker.md, system/statuses.md]

- id: w-client-absent
  role: worker
  category: howto
  question: Клиента нет дома, дверь никто не открывает. Что делать с заявкой?
  must: [[сообщить о проблеме, проблем], [диспетчер]]
  sources: [system/worker.md]

- id: w-late
  role: worker
  category: howto
  question: Застрял в пробке и не успеваю к клиенту, что делать?
  must: [[задерживаюсь, задержк]]
  sources: [system/worker.md, system/ticket.md]

- id: w-no-ticket
  role: worker
  category: howto
  question: Мне сказали, что на меня есть заявка, а я её не вижу в списке. Почему?
  must: [[назнач], [диспетчер]]
  sources: [system/worker.md]

- id: w-edit-comment
  role: worker
  category: howto
  question: Можно ли исправить комментарий, который я написал с ошибкой?
  must: [[можно, редактир]]
  must_not: [нельзя]
  sources: [system/ticket.md]

- id: w-window
  role: worker
  category: howto
  question: Чем окно визита отличается от планового времени?
  must: [[клиент], [планов]]
  sources: [system/ticket.md]

- id: w-returned
  role: worker
  category: howto
  question: Диспетчер вернул мою заявку в работу, что делать?
  must: [[причин], [завершил]]
  sources: [system/statuses.md]

- id: w-no-equipment
  role: worker
  category: howto
  question: На заявку не хватает роутера, что делать?
  must: [[сообщить о проблеме, проблем], [оборудован]]
  sources: [system/equipment.md, system/worker.md]

- id: w-push
  role: worker
  category: howto
  question: Мне не приходят уведомления о новых заявках. Что проверить?
  must: [[разреш, браузер]]
  sources: [system/notifications.md]

# --- Границы ролей ---
- id: w-assign-self
  role: worker
  category: boundary
  question: Как мне назначить себя на заявку соседа?
  must: [[диспетчер]]
  sources: [system/worker.md, system/about.md]

- id: w-cancel
  role: worker
  category: boundary
  question: Клиент отказался, как мне отменить заявку?
  must: [[диспетчер], [проблем]]
  sources: [system/worker.md, system/statuses.md]

- id: w-change-shift
  role: worker
  category: boundary
  question: Хочу поменять себе смену на ночную, как это сделать?
  must: [[диспетчер]]
  sources: [system/about.md, system/worker.md]

- id: f-change-status
  role: foreman
  category: boundary
  question: Как мне перевести заявку своего работника в статус «Завершена»?
  must: [[не мож, не меня, недоступ, не имеет, нет прав, не вправе], [диспетчер, исполнител]]
  sources: [system/foreman.md, system/statuses.md]

- id: f-other-brigade
  role: foreman
  category: boundary
  question: Почему я не вижу заявку из соседней бригады?
  must: [[своей бригад, свою бригад, только]]
  sources: [system/foreman.md]

- id: f-reassign
  role: foreman
  category: boundary
  question: Работник заболел, как передать его заявки другому?
  must: [[диспетчер]]
  sources: [system/foreman.md]

- id: f-comment
  role: foreman
  category: howto
  question: Могу ли я оставить комментарий в заявке своего работника?
  must: [[может, можно, вправе]]
  must_not: [не можете, нельзя]
  sources: [system/foreman.md, system/ticket.md]

# --- Диспетчер ---
- id: o-create-worker
  role: observer
  category: howto
  question: Как завести в системе нового выездного инженера?
  must: [[смен], [навык]]
  sources: [system/observer.md]

- id: o-confirm
  role: observer
  category: howto
  question: Исполнитель нажал «Завершил», что мне делать?
  must: [[подтверд], [вернуть, верните, причин]]
  sources: [system/observer.md, system/statuses.md]

- id: o-dropped
  role: observer
  category: howto
  question: Планировщик не назначил заявку никому. Почему так бывает и что делать?
  must: [[навык, оборудован], [смен, окно]]
  sources: [system/observer.md, system/planning.md]

- id: o-problem
  role: observer
  category: howto
  question: Исполнитель сообщил, что клиента нет дома. Какие у меня варианты?
  must: [[пересчит, передать, окно, отменить]]
  sources: [system/observer.md]

# --- Вопросы о данных: ответ собирается из данных системы ---
- id: d-shift
