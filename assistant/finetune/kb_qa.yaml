# Пары «вопрос → ответ» по базе знаний для дообучения модели.
# Ответ опирается только на указанный раздел: при сборке датасета этот раздел гарантированно
# попадает в «Справку» промпта, как при работе сервиса. Вопросы из eval/questions.yaml
# (включая отложенные h-*) сюда не входят — build_dataset.py это проверяет.

- section: "system/about.md#Что это за система"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что вообще делает эта система?"
      a: "Система планирует выездные работы. Диспетчер принимает заявки и публикует план дня, планировщик раскладывает заявки по исполнителям с учётом смены, участка, навыков, оборудования, окна визита и дороги. Исполнитель видит свой день в приложении и отмечает ход работы кнопками."
    - q: "Кто составляет мне маршрут на день?"
      a: "Маршрут составляет планировщик, а диспетчер публикует план дня. Планировщик учитывает вашу смену, участок, навыки, оборудование, окна визита клиентов и время на дорогу."
    - q: "зачем мне это приложение"
      a: "В приложении вы видите свой день и заявки, отмечаете «Выехал», «Начал работу» и «Завершил», сообщаете о задержке и проблемах и пишете комментарии. Диспетчер сразу видит, как идёт работа."

- section: "system/about.md#Роли пользователей"
  roles: [worker, foreman, observer]
  qa:
    - q: "Чем бригадир отличается от диспетчера?"
      a: "Бригадир видит свою бригаду и её заявки и может писать комментарии, но не назначает исполнителей, не меняет статусы и не отменяет заявки. Диспетчер имеет полный доступ — заявки, назначения, план дня, подтверждение завершения, отмена, бригады и участки."
    - q: "Какие права у обычного исполнителя?"
      a: "Исполнитель видит только свои заявки, нажимает «Выехал», «Начал работу» и «Завершил», сообщает о задержке и проблемах и пишет комментарии. Назначать, отменять и создавать заявки он не может."
    - q: "Кто у нас главный по заявкам?"
      a: "Диспетчер: он принимает заявки, назначает исполнителей, публикует план дня, подтверждает завершение и отменяет заявки."

- section: "system/about.md#Учётная запись и вход"
  roles: [worker, foreman, observer]
  qa:
    - q: "Как зарегистрироваться в системе?"
      a: "Самостоятельной регистрации нет. Учётную запись создаёт диспетчер, он же выдаёт логин и пароль."
    - q: "Забыл пароль, что делать?"
      a: "Обратитесь к диспетчеру — он выдаёт логин и пароль и может помочь с доступом."
    - q: "Меня выкинуло из приложения и просит войти заново"
      a: "Введите логин и пароль ещё раз — обычно сессия продлевается автоматически. Если пароль не подходит, обратитесь к диспетчеру."

- section: "system/about.md#Смена, навыки и участок исполнителя"
  roles: [worker, foreman, observer]
  qa:
    - q: "Как поменять себе участок?"
      a: "Участок исполнителя меняет диспетчер. Сами вы участок, смену, навыки и бригаду изменить не можете — обратитесь к диспетчеру."
    - q: "Хочу добавить себе навык, я уже умею делать подключения"
      a: "Навыки исполнителя меняет диспетчер. Сообщите ему, какие виды работ вы умеете выполнять."
    - q: "Почему мне дают заявки только на моём участке?"
      a: "Планировщик назначает заявку только в пределах вашей смены, на вашем участке и если у вас есть нужный навык. Участок задаёт диспетчер."
    - q: "У меня ночная смена, заявки будут после полуночи?"
      a: "Да, смена может быть ночной и переходить через полночь. Планировщик ставит заявки в пределах вашей смены."

- section: "system/about.md#Помощник в приложении"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что ты умеешь?"
      a: "Я отвечаю на вопросы о вашем дне и заявках по данным системы — смена, сколько заявок, куда ехать дальше, во сколько визит, почему заявку перенесли, что взять с собой. Ещё подсказываю, как работать в системе и как выполнять работы. Если не знаю ответа, так и скажу."
    - q: "Ты можешь сам поменять мне заявку?"
      a: "Нет, я только отвечаю на вопросы и подсказываю. Назначать и переносить заявки может диспетчер."

- section: "system/statuses.md#Какие бывают статусы"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что значит статус «Передана исполнителю»?"
      a: "Это значит, что заявка поступила исполнителю в работу на день. Следующий шаг — нажать «Выехал», когда отправитесь к клиенту."
    - q: "Какие статусы бывают у заявки?"
      a: "«Ждёт назначения», «Назначена», «Передана исполнителю», «В пути», «В работе», «Завершена» и «Отменена». Отменяет заявку только диспетчер."
    - q: "чем «Назначена» отличается от «Передана исполнителю»"
      a: "«Назначена» — у заявки есть исполнитель. «Передана исполнителю» — заявка поступила ему в работу на день."
    - q: "Что значит статус «Отменена»?"
      a: "Клиент отказался или выполнить работу невозможно. Отменяет заявку только диспетчер."

- section: "system/statuses.md#Кто меняет статус"
  roles: [worker, foreman, observer]
  qa:
    - q: "Какие кнопки я нажимаю по заявке и в каком порядке?"
      a: "По порядку — «Выехал» (статус «В пути»), затем «Начал работу» («В работе»), затем «Завершил» («Завершена», ждёт подтверждения диспетчера). Пропустить шаг нельзя."
    - q: "Уже на месте у клиента, какую кнопку жать?"
      a: "Если «Выехал» уже отмечен, нажмите «Начал работу» — статус станет «В работе»."
    - q: "Выезжаю к клиенту, что отметить?"
      a: "Нажмите «Выехал» — статус заявки станет «В пути», и диспетчер увидит, что вы в дороге."
    - q: "Может ли бригадир поменять статус заявки?"
      a: "Нет, бригадир статусы не меняет. Статус меняет исполнитель своими кнопками или диспетчер."
    - q: "Кто может переоткрыть завершённую заявку?"
      a: "Диспетчер: он может изменить статус любой заявки, отменить её, переоткрыть и подтвердить завершение."

- section: "system/statuses.md#Подтверждение завершения"
  roles: [worker, foreman, observer]
  qa:
    - q: "Я нажал «Завершил», а заявка висит неподтверждённой. Это нормально?"
      a: "Да. После «Завершил» заявка завершена и вы свободны для следующей, а диспетчер проверяет завершение. Он подтвердит его или вернёт заявку с причиной, о решении придёт уведомление."
    - q: "Мне пришло, что заявку вернули. Почему так бывает?"
      a: "Диспетчер проверил завершение и вернул заявку в работу — причина указана в уведомлении. Прочитайте её, доделайте работу и снова нажмите «Завершил»."
    - q: "Нужно ли ждать подтверждения, прежде чем ехать на следующую заявку?"
      a: "Нет. После «Завершил» вы свободны и можете ехать на следующую заявку, а диспетчер подтвердит завершение позже."
    - q: "Кто подтверждает, что работа сделана?"
      a: "Диспетчер. Он подтверждает завершение или возвращает заявку в работу с причиной."

- section: "system/statuses.md#Заявки, которые уже не переставляют"
  roles: [worker, foreman, observer]
  qa:
    - q: "Могут ли забрать заявку, если я уже еду к клиенту?"
      a: "Нет. Заявки «В пути», «В работе» и завершённые планировщик не переносит и не отдаёт другому исполнителю — пересчёт касается только заявок, по которым работа ещё не началась."
    - q: "Если пересчитают план, моя текущая заявка поменяется?"
      a: "Нет, заявку «В работе» планировщик не трогает. Меняться могут только заявки, по которым вы ещё не выехали."

- section: "system/worker.md#Мой день"
  roles: [worker]
  qa:
    - q: "Где посмотреть свои заявки на сегодня?"
      a: "На экране «Мой день»: там смена, заявки по порядку плана, текущая и следующая заявка, сколько сделано и сколько осталось."
    - q: "Учитывает ли порядок заявок дорогу?"
      a: "Да, порядок и плановое время в «Моём дне» уже учитывают дорогу между адресами."
    - q: "Куда делась заявка, которая была утром?"
      a: "Если заявку сняли с вас, она показывается в «Моём дне» отдельно, с причиной. Если заявки нет и там, уточните у диспетчера."
    - q: "Коллега говорит, что эта заявка моя, но у меня её нет"
      a: "Если заявки нет в «Моём дне», значит её вам не назначили. Обратитесь к диспетчеру."

- section: "system/worker.md#Порядок работы по заявке"
  roles: [worker]
  qa:
    - q: "С чего начать работу по новой заявке?"
      a: "Откройте карточку заявки и проверьте адрес, окно визита, плановое время, оборудование, описание и комментарии. Затем нажмите «Выехал», когда отправитесь к клиенту."
    - q: "Опиши весь порядок работы по заявке"
      a: "1. Перед выездом проверьте карточку: адрес, окно, время, оборудование, комментарии. 2. Выехали — «Выехал». 3. Начали работу на месте — «Начал работу». 4. Выполнили и проверили с клиентом — «Завершил» с описанием, что сделано."
    - q: "Что делать после того, как нажал «Завершил»?"
      a: "Переходите к следующей заявке из «Моего дня». Завершение подтвердит диспетчер."

- section: "system/worker.md#Как закрыть заявку"
  roles: [worker]
  qa:
    - q: "Что писать при закрытии заявки?"
      a: "Нажмите «Завершил» и укажите, что сделано, какое оборудование установлено или заменено (модель и серийный номер), результат проверки и замечания для следующего визита."
    - q: "как правильно завершить работу у клиента"
      a: "Проверьте результат вместе с клиентом, нажмите «Завершил» и коротко опишите, что сделано. Заявка уйдёт диспетчеру на подтверждение."
    - q: "Обязательно указывать серийник оборудования?"
      a: "Да, при завершении укажите модель и серийный номер установленного или заменённого оборудования."

- section: "system/worker.md#Опаздываю или задерживаюсь"
  roles: [worker]
  qa:
    - q: "Работа затянулась, не успеваю на следующую заявку"
      a: "Нажмите «Задерживаюсь» и укажите, во сколько освободитесь, и причину. Диспетчер увидит это и при необходимости перестроит план."
    - q: "Опаздываю к клиенту минут на 30, кому сказать?"
      a: "Нажмите «Задерживаюсь» и укажите время и причину — диспетчер сразу это увидит и решит, переносить ли следующие заявки."
    - q: "Что будет, если я нажму «Задерживаюсь»?"
      a: "Диспетчер получит уведомление с вашим временем и причиной и при необходимости перестроит план — перенесёт следующие заявки или отдаст их другому исполнителю."

- section: "system/worker.md#Если не получается выполнить заявку"
  roles: [worker]
  qa:
    - q: "Приехал, а в подъезд не попасть, домофон не работает"
      a: "Нажмите «Сообщить о проблеме», выберите причину «нет доступа» и коротко опишите ситуацию. Сообщение попадёт в комментарии заявки и к диспетчеру."
    - q: "Клиент передумал и не хочет подключение. Что мне делать?"
      a: "Нажмите «Сообщить о проблеме» с причиной «клиент отказался». Отменить заявку сам исполнитель не может — решение примет диспетчер, а пока статус не меняйте."
    - q: "Нужна помощь второго человека на заявке"
      a: "Нажмите «Сообщить о проблеме» с причиной «нужна помощь» и опишите, что требуется. Диспетчер решит, как помочь."
    - q: "Клиент не берёт трубку и не открывает"
      a: "Нажмите «Сообщить о проблеме» с причиной «клиента нет на месте» и добавьте пару слов. Статус не меняйте, пока диспетчер не решит."

- section: "system/worker.md#Чего исполнитель сделать не может"
  roles: [worker]
  qa:
    - q: "Можно я сам возьму свободную заявку?"
      a: "Нет, исполнитель не назначает себя на заявки. Назначает диспетчер — обратитесь к нему."
    - q: "Могу ли я отменить заявку сам?"
      a: "Нет, отменяет заявку только диспетчер. Если выполнить работу невозможно, нажмите «Сообщить о проблеме»."
    - q: "Как посмотреть заявки коллеги?"
      a: "Исполнитель видит только свои заявки. Чужие заявки ему не видны."
    - q: "Можно создать заявку, если клиент попросил на месте ещё что-то?"
      a: "Нет, исполнитель заявки не создаёт. Напишите об этом в комментарии или скажите диспетчеру — заявку создаст он."
    - q: "Хочу работать в другой бригаде, как перейти?"
      a: "Бригаду исполнителя меняет диспетчер. Обратитесь к нему."

- section: "system/ticket.md#Поля заявки"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что указано в карточке заявки?"
      a: "Название, описание, категория, приоритет, адрес, окно визита, плановое время и прибытие по плану, ожидаемая длительность, исполнитель, оборудование, статус, комментарии и история изменений."
    - q: "Сколько исполнителей может быть на одной заявке?"
      a: "Один — у каждой заявки один исполнитель."
    - q: "Какие бывают категории заявок?"
      a: "Авария, подключение, ремонт у клиента и дозаказ оборудования."
    - q: "Что важнее — авария или подключение?"
      a: "Авария. Порядок приоритета — сначала аварии, затем подключения, затем ремонт и дозаказ оборудования."

- section: "system/ticket.md#Окно визита и плановое время — в чём разница"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что такое окно визита?"
      a: "Это интервал, когда клиент готов принять специалиста, например с 10:00 до 14:00. Приезжать нужно к плановому времени, а окно показывает, насколько можно сдвинуться."
    - q: "Что будет, если приеду раньше планового времени, но в окне клиента?"
      a: "Ориентир — плановое время, а окно показывает, насколько можно сдвинуться, не нарушив договорённость с клиентом. Если выходите из окна, нажмите «Задерживаюсь»."
    - q: "Не успеваю в окно клиента"
      a: "Нажмите «Задерживаюсь» и укажите, во сколько сможете приехать, — диспетчер увидит это и решит, что делать."

- section: "system/ticket.md#Как найти адрес и подъезд"
  roles: [worker, foreman, observer]
  qa:
    - q: "В заявке не указан подъезд, как быть?"
      a: "Уточните подъезд у клиента и напишите его в комментарии, чтобы следующий специалист знал."
    - q: "Точка на карте у всех квартир дома одна и та же?"
      a: "Да, у квартир одного дома точка одинаковая, поэтому ориентируйтесь на подъезд и этаж из адреса в карточке."

- section: "system/ticket.md#Комментарии к заявке"
  roles: [worker, foreman, observer]
  qa:
    - q: "Опечатался в комментарии, могу поправить?"
      a: "Да, свой комментарий можно отредактировать. Чужой комментарий изменить нельзя."
    - q: "Можно ли удалить или поправить комментарий диспетчера?"
      a: "Нет, чужой комментарий редактировать нельзя. Свой — можно."
    - q: "Кто видит мои комментарии в заявке?"
      a: "Диспетчер, исполнитель заявки и бригадир его бригады."
    - q: "Что стоит писать в комментариях?"
      a: "Всё, что важно для следующего визита — контакты на месте, доступ к щиту, причины задержки."
    - q: "Какой максимальный размер комментария?"
      a: "До 4000 символов."
    - q: "Бригадир может прочитать комментарии по моей заявке?"
      a: "Да, комментарии заявки видят диспетчер, исполнитель и бригадир его бригады."

- section: "system/ticket.md#История изменений заявки"
  roles: [worker, foreman, observer]
  qa:
    - q: "Где посмотреть, кто перенёс заявку?"
      a: "В истории изменений в карточке заявки — там видно, когда заявку назначили, перенесли, сняли или отменили, кто это сделал и почему."
    - q: "Как узнать, почему поменяли время по заявке?"
      a: "Причина записана в истории изменений заявки. Можно спросить и меня — я отвечу по данным системы."

- section: "system/planning.md#Как строится план дня"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что учитывает планировщик, когда раздаёт заявки?"
      a: "Смену исполнителя, участок, навыки, оборудование, окно визита клиента, норматив работы и время на дорогу."
    - q: "Если людей не хватает, какие заявки делают первыми?"
      a: "Сначала аварии, затем подключения, затем ремонт и дозаказ оборудования."
    - q: "Когда план появляется у меня в приложении?"
      a: "Когда диспетчер опубликует план — после этого он появляется в «Моём дне»."

- section: "system/planning.md#Почему заявку перенесли или сняли"
  roles: [worker, foreman, observer]
  qa:
    - q: "Из-за чего вообще переносят заявки?"
      a: "Чаще всего из-за аварийной заявки, недоступности другого исполнителя, вашей недоступности, задержки на предыдущей работе, просьбы клиента о другом окне или ручного перенаправления диспетчером."
    - q: "Меня отметили недоступным, что будет с моими заявками?"
      a: "Ваши заявки передадут другим исполнителям. Причина записывается в историю изменений заявки."
    - q: "Причина переноса не указана, что делать?"
      a: "Уточните у диспетчера."

- section: "system/planning.md#Почему планировщик не назначил заявку"
  roles: [worker, foreman, observer]
  qa:
    - q: "Почему у заявки до сих пор нет исполнителя?"
      a: "Заявка остаётся без исполнителя, если ни у кого на участке нет нужного навыка или оборудования, работа не помещается в смену с учётом дороги или окно клиента недостижимо. Такие заявки диспетчер разбирает вручную."

- section: "system/planning.md#Если порядок заявок неудобен"
  roles: [worker, foreman, observer]
  qa:
    - q: "Мне неудобен порядок заявок, можно поменять местами?"
      a: "Перестраивать маршрут самостоятельно не нужно. Если не успеваете или порядок явно неудобен, нажмите «Задерживаюсь» или напишите диспетчеру — он может пересчитать план на остаток дня."
    - q: "Могу я сам перестроить маршрут?"
      a: "Нет, маршрут строит планировщик. Если порядок неудобен, скажите диспетчеру — он может пересчитать план."

- section: "system/equipment.md#Где брать оборудование"
  roles: [worker, foreman, observer]
  qa:
    - q: "Где получить оборудование на день?"
      a: "В офисе в начале смены. Комплект собирают под заявки дня, а что нужно по каждой заявке, указано в её карточке."
    - q: "Как узнать, что у меня сейчас на руках?"
      a: "В разделе оборудования — там видно, что на руках и что положено получить на день."
    - q: "Почему мне дали заявку, если у меня нет нужного оборудования?"
      a: "При перепланировании исполнителю назначают только заявки, под которые у него есть оборудование. Если чего-то не хватает, нажмите «Сообщить о проблеме»."

- section: "system/equipment.md#Не хватает оборудования"
  roles: [worker, foreman, observer]
  qa:
    - q: "Сломался терминал, который надо поставить клиенту"
      a: "Нажмите «Сообщить о проблеме» с причиной «не хватает оборудования» и опишите, что случилось. Диспетчер решит, передать заявку другому или перенести её."
    - q: "Нет с собой нужного кабеля"
      a: "Не уезжайте с адреса молча — нажмите «Сообщить о проблеме» с причиной «не хватает оборудования» и опишите, чего не хватает."

- section: "system/equipment.md#Оборудование после работы"
  roles: [worker, foreman, observer]
  qa:
    - q: "Куда сдать снятый у клиента роутер?"
      a: "Неиспользованное и снятое оборудование сдают в офис. Как оформить возврат, уточните у диспетчера."
    - q: "Нужно ли где-то указывать снятое оборудование?"
      a: "Да, укажите модель и серийный номер установленного или снятого оборудования при завершении заявки."

- section: "system/notifications.md#Какие уведомления получает исполнитель"
  roles: [worker, foreman, observer]
  qa:
    - q: "Какие уведомления мне будут приходить?"
      a: "О новой назначенной заявке, о переносе, снятии заявки или смене окна визита — с причиной, и о том, что диспетчер подтвердил завершение или вернул заявку."
    - q: "Узнаю ли я, если мою заявку отдадут другому?"
      a: "Да, придёт уведомление, что заявку сняли с вас, с причиной."

- section: "system/notifications.md#Какие уведомления получает диспетчер"
  roles: [observer]
  qa:
    - q: "О чём мне приходят уведомления как диспетчеру?"
      a: "Об изменении статуса заявки, о завершении, которое ждёт подтверждения, и о задержках и проблемах, о которых сообщили исполнители."

- section: "system/notifications.md#Как приходят уведомления"
  roles: [worker, foreman, observer]
  qa:
    - q: "Пропустил уведомление, где его найти?"
      a: "В разделе уведомлений — там хранится вся история, даже после перезагрузки страницы или обрыва связи."
    - q: "Уведомления приходят, только когда приложение открыто?"
      a: "В открытом приложении они появляются сразу, а при закрытом приходят push-уведомлением в браузер, если вы разрешили уведомления."

- section: "system/notifications.md#Не приходят push-уведомления"
  roles: [worker, foreman, observer]
  qa:
    - q: "Пуши перестали приходить после выхода из аккаунта"
      a: "После выхода из профиля push на это устройство не приходят. Войдите в систему снова и проверьте, что браузер разрешил уведомления для сайта."
    - q: "На телефоне не всплывают уведомления"
      a: "Проверьте, что браузер разрешил уведомления для сайта и что вы вошли в систему на этом устройстве. История всё равно есть в разделе уведомлений; если не помогло, сообщите диспетчеру."

- section: "system/foreman.md#Что видит бригадир"
  roles: [foreman]
  qa:
    - q: "Какие заявки я вижу как бригадир?"
      a: "Заявки, назначенные работникам вашей бригады. Заявки других бригад и неназначенные заявки вам не видны."
    - q: "По ссылке на заявку пишет, что она не найдена"
      a: "Скорее всего, это заявка другой бригады или неназначенная — бригадиру они не видны, даже по прямой ссылке."
    - q: "Могу ли я видеть смены своих работников?"
      a: "Да, бригадир видит работников своей бригады, их смены и заявки."

- section: "system/foreman.md#Что может бригадир"
  roles: [foreman]
  qa:
    - q: "Что я могу делать как бригадир?"
      a: "Смотреть заявки и профили работников своей бригады, читать и писать комментарии к их заявкам, редактировать свои комментарии и смотреть, какие завершённые заявки бригады ждут подтверждения диспетчера."
    - q: "Можно написать работнику в заявку, что надо зайти к консьержу?"
      a: "Да, бригадир может писать комментарии к заявкам своей бригады."
    - q: "Как мне посмотреть, что бригада закрыла, но диспетчер ещё не подтвердил?"
      a: "Бригадир может смотреть завершённые заявки бригады, которые ждут подтверждения диспетчера. Подтверждает их диспетчер."

- section: "system/foreman.md#Чего бригадир не может"
  roles: [foreman]
  qa:
    - q: "Могу ли я закрыть заявку за своего работника?"
      a: "Нет, бригадир не меняет статусы заявок. Завершает заявку исполнитель, а подтверждает диспетчер."
    - q: "Хочу отдать заявку другому человеку из бригады"
      a: "Бригадир не назначает и не снимает исполнителей. Напишите комментарий к заявке с просьбой и обратитесь к диспетчеру — переназначает он."
    - q: "Как мне подтвердить работу бригады?"
      a: "Бригадир подтвердить завершение не может — это делает диспетчер."
    - q: "Можно мне добавить нового работника в бригаду?"
      a: "Нет, состав бригады меняет диспетчер."
    - q: "Клиент отказался, могу я отменить заявку своего работника?"
      a: "Нет, бригадир не отменяет заявки. Отменяет диспетчер — напишите ему или попросите работника нажать «Сообщить о проблеме»."

- section: "system/foreman.md#Как контролировать день бригады"
  roles: [foreman]
  qa:
    - q: "Как следить, как работает бригада?"
      a: "Смотрите статусы заявок бригады — «Передана исполнителю», «В пути», «В работе», «Завершена». Долгое «В работе», задержки и сообщения о проблемах — повод связаться с работником."
    - q: "Работник давно «В пути», что делать?"
      a: "Это повод связаться с работником и уточнить, что случилось. Если нужно перенести или передать заявку, обратитесь к диспетчеру."

- section: "system/observer.md#Как завести исполнителя"
  roles: [observer]
  qa:
    - q: "Как создать учётную запись бригадира?"
      a: "Создайте пользователя с ролью «бригадир»: имя, фамилия, логин и пароль. Логин уникален без учёта регистра."
    - q: "Что нужно заполнить для нового инженера?"
      a: "Имя, фамилию, логин, пароль и роль «исполнитель», а также смену, навыки, бригаду и участок."
    - q: "Может ли инженер сам зарегистрироваться?"
      a: "Нет, открытой регистрации нет — пользователей создаёт диспетчер."

- section: "system/observer.md#Заявки и назначение"
  roles: [observer]
  qa:
    - q: "Как назначить заявку вручную?"
      a: "Выберите исполнителя для заявки — у заявки один исполнитель. Система проверит, подходит ли он по навыкам, участку, смене и оборудованию, а новый исполнитель получит уведомление."
    - q: "Откуда берётся длительность заявки?"
      a: "Из норматива вида работ, выбранного в заявке."
    - q: "Что нужно указать при создании заявки?"
      a: "Адрес, категорию, вид работ, окно визита и описание. Длительность подставится из норматива вида работ."

- section: "system/observer.md#План дня и пересчёт"
  roles: [observer]
  qa:
    - q: "Как перестроить план после аварии?"
      a: "Пересчитайте план дня на оставшуюся часть. Заявки в пути, в работе и завершённые при пересчёте не трогаются, а причины переносов попадут в историю изменений заявок."
    - q: "Когда исполнители увидят план?"
      a: "После того как вы его опубликуете — план появится у них в «Моём дне»."

- section: "system/observer.md#Подтверждение завершения"
  roles: [observer]
  qa:
    - q: "Где заявки, которые надо подтвердить?"
      a: "В очереди «Ждут подтверждения» — туда попадают заявки, по которым исполнитель нажал «Завершил»."
    - q: "Работа сделана не до конца, как вернуть заявку?"
      a: "Верните заявку в работу из очереди «Ждут подтверждения» с обязательной причиной. Исполнитель получит уведомление."
    - q: "Можно вернуть заявку без объяснения?"
      a: "Нет, при возврате заявки в работу причина обязательна — исполнитель увидит её в уведомлении."

- section: "system/observer.md#Задержки и проблемы"
  roles: [observer]
  qa:
    - q: "Исполнитель пишет, что не хватает оборудования. Что делать?"
      a: "Решение за вами — пересчитать план, передать заявку другому исполнителю, сменить окно визита или отменить заявку."
    - q: "Где я увижу сообщение о проблеме от исполнителя?"
      a: "Придёт уведомление, а сообщение появится в комментариях заявки."

- section: "system/observer.md#Планировщик не назначил заявку никому"
  roles: [observer]
  qa:
    - q: "Заявка осталась без исполнителя после плана, как разобрать?"
      a: "Посмотрите объяснение причины — нет исполнителя с нужным навыком или оборудованием, не хватает смены или окно недостижимо. Затем назначьте исполнителя вручную, согласуйте с клиентом другое окно или перенесите заявку на другой день."

- section: "work/emergency.md#Авария: главное"
  roles: [worker, foreman, observer]
  qa:
    - q: "Какой норматив на аварию?"
      a: "100 минут — 20 минут на дорогу и 80 минут работы. Время отсчитывается от поступления заявки."
    - q: "Почему авария сдвинула мои другие заявки?"
      a: "У аварии высший приоритет — она затрагивает многих абонентов, поэтому её ставят раньше подключений, ремонта и дозаказа, и она может сдвинуть другие заявки в маршруте."
    - q: "Можно лезть в колодец без допуска, если авария срочная?"
      a: "Нет. Безопасность важнее скорости — работы на высоте, в колодцах и щитах только с допуском и средствами защиты."

- section: "work/emergency.md#Авария: что делать первым делом"
  roles: [worker, foreman, observer]
  qa:
    - q: "Как найти место обрыва оптики?"
      a: "Используйте рефлектометр — он покажет расстояние до повреждения."
    - q: "На аварии нужна техника, что делать?"
      a: "Сразу нажмите «Сообщить о проблеме» и опишите, что нужно. Диспетчер решит, как помочь."
    - q: "Можно временно восстановить связь по обходной схеме?"
      a: "Да, временная схема допустима, чтобы быстрее вернуть сервис абонентам, но её нужно указать при завершении заявки."

- section: "work/emergency.md#Авария: оптика и безопасность"
  roles: [worker, foreman, observer]
  qa:
    - q: "Как проверить, идёт ли сигнал по волокну?"
      a: "Оптическим тестером или визуальным дефектоскопом. Никогда не смотрите в торец волокна или коннектор — лазер невидим и опасен для глаз."
    - q: "Опасно ли заглядывать в порт оборудования?"
      a: "Да, лазерное излучение невидимо и опасно для глаз. Не смотрите в торец волокна, коннектор или порт."

- section: "work/emergency.md#Авария: как закрыть заявку"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что указать при закрытии аварии?"
      a: "Причину аварии, место повреждения, что восстановлено, время восстановления связи, осталась ли временная схема и нужны ли повторные работы."
    - q: "После аварии нужна доработка, как быть?"
      a: "Скажите диспетчеру — он создаст отдельную заявку на плановую доработку."

- section: "work/connection.md#Подключение: перед выездом"
  roles: [worker, foreman, observer]
  qa:
    - q: "Сколько времени закладывается на подключение?"
      a: "90 минут — 20 минут на дорогу, 60 минут работы и 10 минут на оформление документов."
    - q: "Что проверить перед выездом на подключение?"
      a: "Адрес, подъезд, этаж и квартиру, тариф и тип подключения, нужное оборудование и комментарии — есть ли доступ к щиту и контакты управляющей компании."

- section: "work/connection.md#Подключение: что взять с собой"
  roles: [worker, foreman, observer]
  qa:
    - q: "Какой инструмент нужен для оптического подключения?"
      a: "Стриппер, скалыватель, механические соединители или сварочный аппарат, оптический тестер, салфетки и спирт для очистки коннекторов и контейнер для обрезков волокна."
    - q: "Где посмотреть, какое оборудование нужно на конкретное подключение?"
      a: "Точный список оборудования указан в карточке заявки."

- section: "work/connection.md#Подключение: порядок работ"
  roles: [worker, foreman, observer]
  qa:
    - q: "С чего начинается подключение в квартире?"
      a: "Согласуйте с клиентом место ввода кабеля и место установки роутера, затем проложите кабель от щита до квартиры аккуратно и закрепите его."
    - q: "Как проверить, что подключение работает?"
      a: "Активируйте подключение по данным договора, настройте Wi-Fi и проверьте интернет и скорость на устройстве клиента."
    - q: "Можно ли сильно перегибать оптический кабель?"
      a: "Нет, оптику не перегибайте сильнее допустимого радиуса."

- section: "work/connection.md#Подключение: частые проблемы"
  roles: [worker, foreman, observer]
  qa:
    - q: "Щит на этаже закрыт, что делать?"
      a: "Свяжитесь с управляющей компанией или консьержем. Если доступа нет, нажмите «Сообщить о проблеме» с причиной «нет доступа»."
    - q: "В щите нет свободного порта"
      a: "Нажмите «Сообщить о проблеме» — может понадобиться монтажная бригада."
    - q: "Клиент против того, как я веду кабель"
      a: "Предложите варианты трассы, а решение запишите в комментарий."

- section: "work/connection.md#Подключение: как закрыть заявку"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что указать при завершении подключения?"
      a: "Тип подключения, модель и серийный номер установленного оборудования, скорость при проверке и особенности доступа к щиту для будущих визитов."

- section: "work/repair.md#Ремонт: что это за заявки"
  roles: [worker, foreman, observer]
  qa:
    - q: "Сколько времени даётся на ремонт у клиента?"
      a: "50 минут — 20 минут на дорогу и 30 минут работы."
    - q: "Что такое локальная заявка?"
      a: "Ремонт у клиента — нет интернета, низкая скорость, не работает Wi-Fi, нужно настроить или заменить роутер."

- section: "work/repair.md#Ремонт: диагностика"
  roles: [worker, foreman, observer]
  qa:
    - q: "У клиента вообще нет интернета, с чего начать?"
      a: "Выясните симптом, проверьте индикаторы роутера (питание, линия, интернет) и подключите ноутбук кабелем напрямую — так станет ясно, проблема в роутере или в линии."
    - q: "Как понять, проблема в роутере или в линии?"
      a: "Подключите ноутбук кабелем напрямую. Если по кабелю интернет есть — проблема в роутере или Wi-Fi, если нет — в линии."
    - q: "Коннектор на кабеле выглядит плохо"
      a: "Осмотрите кабель и коннекторы и при необходимости переобжмите коннектор."

- section: "work/repair.md#Ремонт: низкая скорость по Wi-Fi"
  roles: [worker, foreman, observer]
  qa:
    - q: "Скорость по кабелю нормальная, а по Wi-Fi плохая"
      a: "Значит, проблема в Wi-Fi — расстояние, стены, загруженный канал или старое устройство клиента. Поставьте роутер ближе к центру квартиры, смените канал и включите 5 ГГц."
    - q: "Нормально, что по Wi-Fi медленнее, чем по кабелю?"
      a: "Да, скорость по Wi-Fi почти всегда ниже, чем по кабелю. Сравнивать с тарифом нужно скорость по кабелю."

- section: "work/repair.md#Ремонт: настройка и замена роутера"
  roles: [worker, foreman, observer]
  qa:
    - q: "Можно оставить клиенту старое имя сети при замене роутера?"
      a: "Да, по согласованию с клиентом можно оставить прежнее имя сети и пароль."
    - q: "Какой пароль ставить на Wi-Fi?"
      a: "Надёжный пароль с шифрованием WPA2 или WPA3. Также смените заводской пароль администратора роутера."
    - q: "Куда записать пароль от Wi-Fi клиента, чтобы не забыть?"
      a: "Пароль Wi-Fi клиента в комментарий не пишите."

- section: "work/repair.md#Ремонт: как закрыть заявку"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что написать при закрытии ремонта?"
      a: "Найденную причину, что сделано, скорость по кабелю и по Wi-Fi, модель и серийный номер снятого и установленного оборудования."
    - q: "Причина оказалась на линии, закрывать заявку?"
      a: "Нет, не завершайте — нажмите «Сообщить о проблеме»."

- section: "work/additional.md#Дозаказ: что это за заявки"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что такое дозаказ?"
      a: "Клиент заказал дополнительное оборудование — второй роутер или точку доступа, ТВ-приставку, ONT-терминал на замену."
    - q: "Сколько времени на дозаказ оборудования?"
      a: "40 минут — 20 минут на дорогу, 10 минут работы и 10 минут на оформление документов."

- section: "work/additional.md#Дозаказ: перед выездом"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что проверить перед выездом на дозаказ?"
      a: "Какое оборудование и сколько нужно доставить и что оно есть в вашем комплекте на день. Если его нет или оно неисправно, нажмите «Сообщить о проблеме» до выезда."

- section: "work/additional.md#Дозаказ: порядок работ"
  roles: [worker, foreman, observer]
  qa:
    - q: "Привёз клиенту точку доступа, что дальше?"
      a: "Сверьте модель с заявкой, подключите точку к сети клиента и проверьте работу вместе с ним. Коротко объясните, как пользоваться и куда обращаться при проблемах."

- section: "work/additional.md#Дозаказ: как закрыть заявку"
  roles: [worker, foreman, observer]
  qa:
    - q: "Что указать, когда закрываю дозаказ?"
      a: "Модель и серийный номер переданного оборудования и результат проверки."
